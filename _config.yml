title: Tech Interview Handbook
description: Java, Spring Boot, Microservices, System Design and Coding interview questions with answers
theme: just-the-docs

# Project site: https://achhecode.github.io/tech-interview-handbook
url: https://achhecode.github.io
baseurl: "/tech-interview-handbook"

# Apply the theme layout to every page automatically
defaults:
  - scope:
      path: ""
    values:
      layout: default

# Search
search_enabled: true
search:
  heading_level: 2        # every "## Question" becomes its own search result
  previews: 3
  rel_url: true
  button: false

# Navigation and reading experience
heading_anchors: true
enable_copy_code_button: true
back_to_top: true
back_to_top_text: "Back to top"
color_scheme: light       # or: dark

aux_links:
  GitHub: https://github.com/achhecode/tech-interview-handbook
  Portfolio: https://achhecode.github.io
aux_links_new_tab: true

# Callouts used in the content:  {: .tip }  {: .trap }  {: .note }  {: .important }
callouts_level: quiet
callouts:
  tip:
    title: Interview Tip
    color: green
  trap:
    title: Common Trap
    color: red
  note:
    title: Note
    color: blue
  important:
    title: Important
    color: yellow

footer_content: "&copy; 2026 Achhe Code. Distributed under the MIT license."

gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/achhecode/tech-interview-handbook"
gh_edit_branch: "main"
gh_edit_view_mode: "tree"

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
